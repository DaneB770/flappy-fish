<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flappy Fish Game</title>
<link rel="manifest" href="/hombrebueno-finalexam-fluffyfishflappy-fish/manifest.json">
<meta name="theme-color" content="#87ceeb">
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #87ceeb;
    overflow: hidden;
  }
  #game-container {
    position: relative;
    width: 480px;
    height: 640px;
    margin: 20px auto;
    background: url('images/bg.jpg') no-repeat center center;
    background-size: cover;
    border: 2px solid #000;
    border-radius: 10px;
  }
  canvas {
    display: block;
    background: transparent;
  }
  #start-screen, #game-over-screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 1.2em;
    padding: 20px;
    text-align: center;
    border-radius: 10px;
  }
  #start-screen button, #game-over-screen button {
    font-size: 1.5em;
    padding: 10px 20px;
    margin-top: 20px;
    cursor: pointer;
    border-radius: 8px;
    border: none;
    background-color: #28a745;
    color: white;
  }
  #mute-button {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 2em;
    cursor: pointer;
    user-select: none;
  }
  #score {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 2em;
    color: white;
    text-shadow: 2px 2px 4px #000;
    user-select: none;
  }
  #install-button {
    font-size: 1em;
    padding: 8px 12px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: none;
    margin: 24px auto 0;
    display: block;
    position: static;
  }
  #offline-warning {
    position: absolute;
    bottom: 10px;
    left: 10px;
    font-size: 1em;
    color: #ffcc00;
    text-shadow: 1px 1px 2px #000;
    user-select: none;
    display: none;
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game-canvas" width="480" height="640"></canvas>
  <div id="start-screen">
    <h1>🐟 Flappy Fish 🐟</h1>
    <p>Tap the screen or press space to make the fish swim up! 🐠🐡</p>
    <p>Avoid the obstacles and score points! 🎯</p>
    <button id="start-button">Start Game ▶️</button>
  </div>
  <div id="game-over-screen" style="display:none;">
    <h2>Game Over 💥</h2>
    <p>Your Score: <span id="final-score">0</span></p>
    <p>Highscore: <span id="high-score">0</span></p>
    <button id="retry-button">Retry 🔄</button>
  </div>
  <div id="mute-button" title="Mute/Unmute">🔊</div>
  <div id="score">0</div>
  <div id="offline-warning">⚠️ No Internet Connection</div>
</div>
<button id="install-button" style="margin: 24px auto 0; display: none; position: static; display: block;">Install PAWS</button>
<script src="main.js"></script>
</body>
</html>
